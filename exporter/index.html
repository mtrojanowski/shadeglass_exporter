<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHU Data Exporter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" type="module"></script>
</head>
<body>
<div class="container">
<h1>WHU Data Exporter</h1>
<p>Export tournament data from popular TO apps to WHU Statistics data format.</p>

    <div id="googleSheetsControls" style="margin: 16px 0;">
        <button id="googleAuthBtn" type="button" onclick="(() => handleGoogleAuth())()">Connect Google Sheets</button>
        <span class="loader" style="display:none;">.</span>
        <details class="google-sheets-details">
            <summary>Google Sheets Identifiers</summary>
            <label for="sheetIdInput">Google Sheet ID</label>
            <input id="sheetIdInput" type="text" class="google-sheets-input" onchange="((event) => updateSheetId(event))(event)" />
            <label for="submissionsSheetName">Submissions Sheet</label>
            <input id="submissionsSheetName" type="text" class="google-sheets-input" onchange="((event) => updateSubmissionSheetName(event))(event)" />
            <label for="eventsSheetName">Events Sheet</label>
            <input id="eventsSheetName" type="text" class="google-sheets-input" onchange="((event) => updateEventsSheetName(event))(event)" />
            <label for="podiumSheetName">Podium Sheet</label>
            <input id="podiumSheetName" type="text" class="google-sheets-input" onchange="((event) => updatePodiumSheetName(event))(event)" />
        </details>
    </div>
<form>
    <div>
        <label>Import source:</label>
        <label><input type="radio" name="importSource" value="bcp" checked> BCP</label>
        <label><input type="radio" name="importSource" value="shadeglass"> Shadeglass</label>
    </div>
    <div>
        <label for="token">BCP access token</label>
        <input type="text" id="token" />
    </div>
    <div>
        <label for="tournament">Input public URL for the tournament, or tournament ID</label>
        <input type="text" id="tournament" />
    </div>
    <div>
        <button type="button" onclick="withLoader(this, processData)()">Process</button>
        <span class="loader">.</span>
    </div>
</form>

<div id="invalidateCache" style="display: none">
    <button id="invalidateCacheButton" onclick="withLoader(this, invalidateCacheForCurrentEvent)()">Refresh event data</button>
    <span class="loader">.</span>
</div>
<div>
    <table id="playersTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Faction</th>
                <th>Decklist URL</th>
                <th>Decks</th>
                <th></th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</div>

<div id="continueProcessing" style="display: none">
    <button onclick="withLoader(this, continueProcessing)()">Continue</button>
    <span class="loader">.</span>

</div>
</div>
</body>
</html>
