<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHU Data Exporter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" type="module"></script>
</head>
<body>
<div class="container">
<h1>WHU Data Exporter</h1>
<p>Export tournament data from popular TO apps to WHU Statistics data format.</p>

    <div id="googleSheetsControls" style="margin: 16px 0;">
        <button id="googleAuthBtn" type="button" onclick="(() => handleGoogleAuth())()">Connect Google Sheets</button>
        <span class="loader" style="display:none;">.</span>
        <details class="google-sheets-details">
            <summary>Google Sheets Identifiers</summary>
            <label for="googleApiKey">Google API Key</label>
            <input id="googleApiKey" type="text" class="google-sheets-input form-input" onchange="((event) => updateGoogleApiKey(event))(event)" />
            <label for="googleClientId">Google Client ID</label>
            <input id="googleClientId" type="text" class="google-sheets-input form-input" onchange="((event) => updateGoogleClientId(event))(event)" />
            <label for="sheetIdInput">Google Sheet ID</label>
            <input id="sheetIdInput" type="text" class="google-sheets-input form-input" onchange="((event) => updateSheetId(event))(event)" />
            <label for="submissionsSheetName">Submissions Sheet</label>
            <input id="submissionsSheetName" type="text" class="google-sheets-input form-input" onchange="((event) => updateSubmissionSheetName(event))(event)" />
            <label for="eventsSheetName">Events Sheet</label>
            <input id="eventsSheetName" type="text" class="google-sheets-input form-input" onchange="((event) => updateEventsSheetName(event))(event)" />
            <label for="podiumSheetName">Podium Sheet</label>
            <input id="podiumSheetName" type="text" class="google-sheets-input form-input" onchange="((event) => updatePodiumSheetName(event))(event)" />
        </details>
    </div>
<form>
    <div>
        <label>Import source:</label>
        <label><input type="radio" name="importSource" value="bcp" checked> BCP</label>
        <label><input type="radio" name="importSource" value="shadeglass"> Shadeglass</label>
    </div>
    <div>
        <label for="token">BCP access token</label>
        <input type="text" id="token" class="form-input" />
    </div>
    <div>
        <label for="tournament">Input public URL for the tournament, or tournament ID</label>
        <input type="text" id="tournament" class="form-input" />
    </div>
    <div>
        <button type="button" onclick="withLoader(this, processData)()">Process</button>
        <span class="loader">.</span>
    </div>
</form>

<div id="clearCache" style="display: none">
    <button id="clearCacheButton" onclick="(() => clearCache())()">Clear all cached data</button>
</div>

<div id="eventData" class="eventData">
    <h2>Event Data</h2>
    <label for="eventName">Name</label>
    <input type="text" id="eventName" name="eventName" class="form-input" />
    <label for="eventCountry">Country</label>
    <input type="text" id="eventCountry" name="eventCountry" class="form-input" />
    <label for="countryCode">Country ISO Code</label>
    <input type="text" id="countryCode" name="countryCode" class="form-input" />
    <label for="eventDate">Date</label>
    <input type="text" id="eventDate" name="eventDate" class="form-input" />
    <label for="qualifier">Is the event a WCW Qualifier?</label>
    <input type="checkbox" name="isQualifier" id="qualifier" /><br/>
    <label for="playersNo">Number of players</label>
    <input type="text" name="playersNo" id="playersNo" class="form-input" />
    <label for="tag">The event tag</label>
    <input type="text" id="tag" name="tag" class="form-input" />
    <button onclick="(() => proposeTag())()">Propose tag</button>
</div>

<div id="invalidateCache" style="display: none">
    <button id="invalidateCacheButton" onclick="withLoader(this, invalidateCacheForCurrentEvent)()">Refresh pairings and players data</button>
    <span class="loader">.</span>
</div>
<div>
    <table id="playersTable">
        <thead>
            <tr>
                <th>Place</th>
                <th>Name</th>
                <th>Faction</th>
                <th>Decklist URL</th>
                <th>Decks</th>
                <th></th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</div>

<div id="continueProcessing" style="display: none">
    <button onclick="withLoader(this, continueProcessing)()">Continue</button>
    <span class="loader">.</span>

</div>
</div>
</body>
</html>
