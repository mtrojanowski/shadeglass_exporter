            function populateTable() {
                const tableBody = document.getElementById('resultsTable');


                data.forEach(entry => {
                    const row = document.createElement('tr');

                    // Create and append the first cell
                    const placeCell = document.createElement('td');
                    placeCell.textContent = entry[0];
                    row.appendChild(placeCell);

                    // Create and append the second cell (Warband)
                    const warbandCell = document.createElement('td');
                    const warbandWrapper = document.createElement('div');
                    warbandWrapper.className = 'icon-text-wrapper';
                    const warbandIcon = document.createElement('img');
                    warbandIcon.src = warbandIconsMap[entry[1]];
                    warbandIcon.className = 'icon';
                    warbandWrapper.appendChild(warbandIcon);
                    warbandWrapper.appendChild(document.createTextNode(entry[1]));
                    warbandCell.appendChild(warbandWrapper);
                    row.appendChild(warbandCell);

                    // Create and append the third cell (Rivals Deck 1)

                    deck2Wrapper.appendChild(document.createTextNode(entry[3]));
                    deck2Cell.appendChild(deck2Wrapper);
                    row.appendChild(deck2Cell);

                    // Create and append the fifth cell with a link to the deck, if there's a deck URL

                        const deckCell = document.createElement('td');
                        const deckLink = document.createElement('a');
                        deckLink.href = entry[4];
                        deckLink.textContent = 'View Deck';
                        deckLink.className = 'deck-link';
                        deckLink.target = '_blank';
                        deckCell.appendChild(deckLink);
                        row.appendChild(deckCell);
                    }

                    // Append the row to the table
                    tableBody.appendChild(row);
                });
            }
